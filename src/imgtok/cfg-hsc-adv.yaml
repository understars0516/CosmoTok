# Multi-survey (HSC+DES) adversarial training config with PatchGAN discriminator
# Uses ImageAutoEncoderV2Adv with stats-based preprocessing and ivar weighting
# LPIPS perceptual weight set to 0 by default (VGG trained on natural images, may not suit astronomical data).
# Set perceptual_weight > 0 to enable LPIPS if desired (requires lpips package).
# lightning.pytorch==2.6.0

model:
  class_path: imgtok.model.ImageAutoEncoderV2Adv
  init_args:
    quantizer_levels: [ 7, 5, 5, 5, 5 ]
    hidden_dims: 512
    embedding_dim: 5
    multisurvey_projection_dims: 54
    n_compressions: 2
    num_consecutive: 4
    warmup_steps: 1000
    # Adversarial parameters
    disc_start: 5000
    disc_in_channels: 9
    disc_num_layers: 3
    disc_ndf: 64
    disc_factor: 1.0
    disc_weight: 0.5
    disc_loss: hinge
    perceptual_weight: 0.0
    pixelloss_weight: 1.0
    logvar_init: 0.0
    lpips_in_channels: 9
    use_actnorm: false
    disc_lr: 1.0e-4
    ae_lr: 5.0e-4

data:
  class_path: imgtok.data.ImageDataModuleStats
  init_args:
    batch_size: 64
    num_threads: 32
    num_cpu_workers: 8
    num_io_workers: 4
    num_dataloader_workers: 0

trainer:
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: "hsc_des_adv"
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        every_n_train_steps: 500
        monitor: val_mse
        mode: min
        save_top_k: 3
        auto_insert_metric_name: true
        filename: '{epoch:04d}-{step:06d}-{val_mse:.6f}'
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
  max_epochs: 50
  min_epochs: 1
  val_check_interval: 500
  log_every_n_steps: 10
  gradient_clip_val: null
  gradient_clip_algorithm: null
  detect_anomaly: true
  enable_model_summary: true

  # Default values
  accelerator: auto
  devices: auto
  strategy: auto
  num_nodes: 1
  precision: null
  fast_dev_run: false
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  check_val_every_n_epoch: null
  num_sanity_val_steps: null
  enable_checkpointing: null
  enable_progress_bar: null
  accumulate_grad_batches: 1
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  model_registry: null

seed_everything: true
optimizer: null
lr_scheduler: null
ckpt_path: null
