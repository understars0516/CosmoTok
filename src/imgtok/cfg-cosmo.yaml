# lightning.pytorch==2.6.0

model:
  class_path: imgtok.model.CosmoGridImageAutoEncoder
  init_args:
    hidden_dims: 768 
    embedding_dim: 8
    downsampled_channel_dim: 128
    quantizer_levels: [ 17, 17, 17, 17, 13, 13, 13, 13 ]
    n_compressions: 2
    num_consecutive: 4
    warmup_steps: 1000

data:
  class_path: imgtok.data.CosmoGridDataModule
  init_args:
    root_dir: data/cosmogrid_data
    batch_size: 128
    num_threads: 32
    num_cpu_workers: 32
    num_io_workers: 32
    num_dataloader_workers: 0

trainer:
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: "cosmogrid"
      save_dir: cache/cosmogrid/
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        # dirpath: *save_dir: 不设置, 模型会自动保存到 logger 的 save_dir/<project_name=imgtok>/checkpoints/ 下面
        every_n_train_steps: 200
        monitor: val_mse
        mode: min
        save_top_k: 3
        auto_insert_metric_name: true
        filename: '{epoch:04d}-{step:06d}-{val_mse:.6f}'
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
  default_root_dir:  cache/0
  max_epochs: 1001
  min_epochs: 1
  val_check_interval: 200
  log_every_n_steps: 4
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"
  detect_anomaly: false
  enable_model_summary: true
  limit_val_batches: 0.2
  limit_train_batches: 0.8
  #limit_train_batches: 2400

  # 以下配置项为默认值
  accelerator: auto
  devices: auto
  strategy: ddp_find_unused_parameters_true
  num_nodes: 1
  precision: null
  fast_dev_run: false
  max_steps: -1
  min_steps: null
  max_time: null
#  limit_train_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  check_val_every_n_epoch: null
  num_sanity_val_steps: null
  enable_checkpointing: null
  enable_progress_bar: null
  accumulate_grad_batches: 1
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  model_registry: null

seed_everything: true
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 5e-5
    betas: [0.9, 0.95]
    weight_decay: 0.01

lr_scheduler:
  class_path: torch.optim.lr_scheduler.CosineAnnealingLR
  init_args:
    T_max: 1000
    eta_min: 1e-6

ckpt_path: null
